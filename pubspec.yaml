  easy_localization: ^3.0.7+1
  flutter_phoenix: ^1.1.1
  flutter_native_splash: ^2.4.6
  lottie: ^3.3.1
  dotted_decoration: ^2.0.0
  http:
  url_launcher: ^6.3.2
  pretty_dio_logger: ^1.4.0
  freezed_annotation: ^3.1.0
  package_info_plus: ^8.3.1
  
  retrofit: ^4.6.0
  awesome_snackbar_content: ^0.1.7
